services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.32.7
    container_name: n8n
    restart: unless-stopped

    ports:
      - "127.0.0.1:5678:5678"

    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      TZ: ${TZ}

      N8N_HOST: 127.0.0.1
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://127.0.0.1:5678/
      N8N_WEBHOOK_URL: http://127.0.0.1:5678/
      N8N_SECURE_COOKIE: "false"
      N8N_PROXY_HOPS: "1"

      NODE_ENV: production
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"

      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_RUNNERS_TASK_TIMEOUT: "60"
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: "268435456"
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: "1000"
      N8N_RESTRICT_FILE_ACCESS_TO: /files

    volumes:
      - n8n_data:/home/node/.n8n
      - ./outputs:/files

    networks:
      - n8n_network

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5678/healthz').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    security_opt:
      - no-new-privileges:true

    stop_grace_period: 30s

  docx-renderer:
    build:
      context: ./docx-renderer
      dockerfile: Dockerfile
    image: n8n-docx-renderer:1.0.0
    container_name: n8n-docx-renderer
    restart: unless-stopped

    expose:
      - "3000"

    volumes:
      - ./outputs:/files:ro

    networks:
      - n8n_network

    read_only: true
    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true

  cloudflared:
    image: cloudflare/cloudflared:2026.7.2
    container_name: n8n-cloudflared
    restart: unless-stopped

    command:
      - tunnel
      - --no-autoupdate
      - run

    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}

    networks:
      - n8n_network

    depends_on:
      n8n:
        condition: service_healthy

    security_opt:
      - no-new-privileges:true

volumes:
  n8n_data:
    name: n8n_n8n_data

networks:
  n8n_network:
    name: n8n_network
    driver: bridge
